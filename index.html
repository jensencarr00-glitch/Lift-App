<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lift</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0b">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b0b0b;--text:#d6d6d6;--mute:#8a8a8a;--acc:#ff5c4d;--line:#585858;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;font-family:"Courier New",Courier,monospace!important;border-radius:0!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-size:16px;-webkit-text-size-adjust:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
main{padding:14px 14px calc(120px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
h1{font-size:18px;color:var(--acc);letter-spacing:1px;margin:6px 0 12px}
.art{color:var(--acc);font-size:13px;line-height:1.1;margin:4px 0 6px}
.card{border:1px dashed var(--line);padding:10px 12px;margin-bottom:10px}
.done{opacity:.55}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tip{font-size:13px;color:var(--mute)}.rd{color:var(--acc)}
button{background:none;border:0;color:var(--acc);font-size:14px;padding:6px 4px;text-decoration:underline}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:3ch;height:1.3em;margin:0;background:none;border:0;vertical-align:middle;flex:none}
input[type=checkbox]::before{content:"[ ]";color:var(--mute)}input[type=checkbox]:checked::before{content:"[x]";color:var(--acc)}
input[type=text],input[type=number],select{background:#111;color:var(--text);border:1px dashed var(--line);font-size:16px;padding:8px;width:100%}
.s{display:flex;align-items:center;gap:6px;margin-top:6px}.s input[type=number]{width:30%}.s span{flex:none;width:2ch}
#tb{position:fixed;left:0;right:0;bottom:calc(50px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px dashed var(--acc);padding:8px 14px;color:var(--acc);display:flex;justify-content:space-between;align-items:center;z-index:5}#tb[hidden]{display:none}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px dashed var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;height:50px;text-decoration:none;color:var(--mute);letter-spacing:1px;padding:0;font-size:13px}nav button.on{color:var(--acc)}
</style>
</head>
<body>
<main id="app"></main>
<div id="tb" hidden><span id="tt"></span><button id="tx">[cancel]</button></div>
<nav><button id="t1">[LIFT]</button><button id="t2">[CARDIO]</button><button id="t3">[LOG]</button><button id="t4">[SET]</button></nav>
<script>
var DAYS=[{"n": "DAY 1 - PULL", "x": [["Single-arm DB row", 3, "c", 0, "Free hand on a chair or sofa, flat back"], ["Bent-over DB row (both arms)", 3, "c", 0, "Hinge forward, let the dumbbells hang below your chest"], ["Barbell row", 2, "c", 1, "Hinge forward, lift the bar from the floor"], ["DB reverse fly (rear delts)", 3, "a", 0, "Bent over, light weights, lift out to the sides"], ["DB curl", 3, "a", 0, "Standing, no swinging"], ["Concentration curl", 3, "a", 0, "Sit on a chair, elbow against your inner thigh"]]}, {"n": "DAY 2 - PUSH", "x": [["DB floor press", 3, "c", 0, "Lie on the floor, elbows touch the floor at the bottom"], ["Push-ups", 3, "c", 0, "Hands under shoulders, knees down if needed"], ["Barbell floor press", 2, "c", 1, "Lie on the floor and press from there, no rack needed"], ["DB fly", 2, "a", 0, "Lie on the floor, slight bend in your elbows"], ["DB lateral raise", 3, "a", 0, "Standing, lift to shoulder height"], ["Lean-away lateral raise", 3, "a", 0, "Hold a door frame with one hand and lean away"], ["DB overhead tricep extension", 3, "a", 0, "Both hands on one dumbbell, sitting or standing"]]}, {"n": "DAY 3 - LEGS", "x": [["Goblet squat", 3, "c", 0, "Hold one dumbbell at your chest"], ["Bulgarian split squat", 2, "c", 0, "Back foot on a sofa or sturdy chair"], ["Barbell Romanian deadlift", 3, "c", 1, "Bar starts on the floor, push your hips back"], ["DB Romanian deadlift (hamstrings)", 3, "c", 0, "Soft knees, hips back, flat back"], ["DB reverse lunge", 3, "a", 0, "Step back, front knee over your ankle"], ["Single-leg calf raise", 3, "a", 0, "Stand on the bottom stair and hold the rail"], ["DB sumo squat (adductors)", 3, "a", 0, "Wide stance, toes out, dumbbell between your legs"]]}, {"n": "DAY 4 - ARMS / DELTS", "x": [["DB shoulder press", 2, "c", 0, "Seated on a chair or standing"], ["Barbell curl", 3, "a", 1, "Standing, elbows by your sides"], ["DB hammer curl", 3, "a", 0, "Palms facing each other"], ["DB curl", 3, "a", 0, "Standing, no swinging"], ["DB skull crusher", 3, "a", 0, "Lie on the floor, lower the weights toward your forehead"], ["DB overhead tricep extension", 3, "a", 0, "Both hands on one dumbbell"], ["Bent-over DB rear delt raise", 3, "a", 0, "Hinge forward, lift out to the sides"]]}, {"n": "DAY 5 - CHEST / BACK", "x": [["DB floor press", 3, "c", 0, "Lie on the floor, elbows touch the floor at the bottom"], ["Barbell row", 3, "c", 1, "Hinge forward, lift the bar from the floor"], ["Single-arm DB row", 3, "c", 0, "Free hand on a chair or sofa, flat back"], ["Two-arm DB row", 3, "c", 0, "Hinge forward, pull both to your hips"], ["Push-ups (slow)", 3, "a", 0, "Take 3 seconds to lower"], ["DB fly", 3, "a", 0, "Lie on the floor, slight bend in your elbows"], ["DB pullover", 2, "a", 0, "Lie on the floor, arms from over your chest to behind your head"]]}];
var CT=["Walk","Jog / run","Cycle","Rowing","Other"];
var S,tab=1,TM=null,AC=null;
try{S=JSON.parse(localStorage.getItem("lf1"))}catch(e){}
if(!S||!S.d)S={d:{},c:{},bar:0,mx:20,cur:0};
function save(){try{localStorage.setItem("lf1",JSON.stringify(S))}catch(e){}}
function key(d){d=d||new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function sess(k){return S.d[k]||(S.d[k]={day:S.cur,sets:{}})}
function exl(di){var o=[];DAYS[di].x.forEach(function(e,i){if(!e[3]||S.bar)o.push({i:i,e:e})});return o}
function lastOf(k,before){var ks=Object.keys(S.d).sort().reverse();for(var i=0;i<ks.length;i++){if(ks[i]>=before)continue;var s=(S.d[ks[i]].sets[k]||[]).filter(function(x){return x.d});if(s.length)return{date:ks[i],s:s}}return null}
function hint(k,type,n,before,isb){var lo=type==="c"?10:12,hi=15,L=lastOf(k,before);
 if(!L)return"First time: pick a weight you can do for "+lo+" reps with 1-2 left in the tank.";
 var w=Math.max.apply(null,L.s.map(function(x){return+x.w||0})),sm=L.s.map(function(x){return(x.w||0)+"x"+(x.r||0)}).join(", "),top=L.s.length>=n&&L.s.every(function(x){return+x.r>=hi});
 if(top)return !isb&&w>=S.mx?"Last: "+sm+". You hit "+hi+" reps at your dumbbell max. Add a rep, slow the tempo"+(S.bar?" or switch to the barbell version.":", or use the barbell once you have it."):"Last: "+sm+". You hit the top of the range, so go up to "+(w+2.5)+"kg.";
 return"Last: "+sm+". Beat it by 1 rep."}
function startTimer(sec){TM={e:Date.now()+sec*1000};try{AC=AC||new(window.AudioContext||window.webkitAudioContext)()}catch(x){}tick()}
function tick(){var b=document.getElementById("tb");if(!TM){b.hidden=true;return}b.hidden=false;var r=Math.ceil((TM.e-Date.now())/1000),t=document.getElementById("tt");
 if(r<=0){t.textContent="[ REST DONE ]";if(!TM.d){TM.d=1;try{navigator.vibrate([400,150,400])}catch(x){}try{var o=AC.createOscillator();o.connect(AC.destination);o.frequency.value=880;o.start();setTimeout(function(){o.stop()},600)}catch(x){}}}
 else t.textContent="[ rest "+Math.floor(r/60)+":"+("0"+r%60).slice(-2)+" ]"}
setInterval(tick,500);
function lift(){
 var k=key(),ss=sess(k),di=ss.day,h='<pre class="art">'+[".-.       .-.","|#|=======|#|","'-'       '-'","   5-DAY SPLIT"].join("\n")+'</pre><h1>== LIFT ==</h1>';
 h+='<div class="card"><span class="tip">Workout today</span><select id="dy">'+DAYS.map(function(d,i){return'<option value="'+i+'"'+(i===di?" selected":"")+'>'+d.n+'</option>'}).join("")+'</select><div class="tip" style="margin-top:6px">Compound: 10-15 reps. Accessory: 12-15 reps. Rest: <button data-r="60">[60s]</button><button data-r="90">[90s]</button><button data-r="120">[2 min]</button></div></div>';
 exl(di).forEach(function(o){var id=di+"."+o.i,e=o.e,sets=ss.sets[id]||(ss.sets[id]=[]),done=0;
  var prev=lastOf(id,k),pw=prev?prev.s[prev.s.length-1].w:"";
  for(var j=0;j<e[1];j++){if(!sets[j])sets[j]={w:pw,r:"",d:0};if(sets[j].d)done++}
  h+='<div class="card'+(done===e[1]?" done":"")+'"><div class="row"><b>'+esc(e[0])+(e[3]?' <span class="rd">[bar]</span>':'')+'</b><span class="tip">'+e[1]+' sets</span></div><div class="tip">'+esc(e[4]||'')+'</div><div class="tip" style="margin:4px 0">'+esc(hint(id,e[2],e[1],k,e[3]))+'</div>';
  sets.forEach(function(s,j){h+='<div class="s"><span>'+(j+1)+'</span><input type="number" step="0.5" inputmode="decimal" placeholder="kg" data-w="'+id+','+j+'" value="'+esc(s.w)+'"><input type="number" inputmode="numeric" placeholder="reps" data-p="'+id+','+j+'" value="'+esc(s.r)+'"><input type="checkbox" data-k="'+id+','+j+'"'+(s.d?" checked":"")+'></div>'});
  h+='</div>'});
 return h}
function wkMin(){var t=0,n=new Date();for(var i=0;i<7;i++){var d=new Date();d.setDate(n.getDate()-i);(S.c[key(d)]||[]).forEach(function(c){t+=c.m})}return t}
function cardio(){var k=key(),h='<h1>== CARDIO ==</h1><div class="card"><b>> LOG</b><select id="ct" style="margin-top:6px">'+CT.map(function(c){return"<option>"+c+"</option>"}).join("")+'</select><input type="number" id="cm" placeholder="minutes" inputmode="numeric" style="margin-top:6px"><button id="ca">[add session]</button><button id="cq">[+30 min walk]</button></div>';
 var w=wkMin(),p=Math.min(100,Math.round(w/150*100)),n=Math.round(p/5);
 h+='<div class="card"><b>> THIS WEEK</b><div class="tip" style="margin-top:6px">['+"#".repeat(n)+"-".repeat(20-n)+'] '+w+' / 150 min</div><div class="tip">150 min a week of moderate cardio is the usual UK guideline.</div></div><div class="card"><b>> TODAY</b>';
 var L=S.c[k]||[];h+=L.length?L.map(function(c,i){return'<div class="row"><span>'+esc(c.t)+' '+c.m+' min</span><button data-cx="'+i+'">[x]</button></div>'}).join(""):'<div class="tip">Nothing logged yet.</div>';
 return h+'</div>'}
function logv(){var h='<h1>== LOG ==</h1>',ks=Object.keys(S.d).sort().reverse().slice(0,14),n=0,nw=new Date();
 for(var i=0;i<7;i++){var d=new Date();d.setDate(nw.getDate()-i);var s=S.d[key(d)];if(s&&Object.keys(s.sets).some(function(q){return s.sets[q].some(function(x){return x.d})}))n++}
 h+='<div class="card"><b>> THIS WEEK</b><div class="tip" style="margin-top:6px">Workouts done: '+n+' / 5<br>Cardio: '+wkMin()+' min</div></div>';
 ks.forEach(function(k){var s=S.d[k],sets=0,vol=0;Object.keys(s.sets).forEach(function(q){s.sets[q].forEach(function(x){if(x.d){sets++;vol+=(+x.w||0)*(+x.r||0)}})});
  if(sets)h+='<div class="card"><div class="row"><b>'+k.slice(5)+'</b><span class="tip">'+DAYS[s.day].n+'</span></div><div class="tip">'+sets+' sets done, volume '+Math.round(vol).toLocaleString("en-GB")+' kg</div></div>'});
 return h}
function setv(){return'<h1>== SET ==</h1><div class="card"><div class="row"><span>I have a barbell</span><input type="checkbox" id="bb"'+(S.bar?" checked":"")+'></div><div class="tip">Adds the barbell lifts, marked [bar].</div></div><div class="card"><span class="tip">Max weight per dumbbell (kg)</span><input type="number" id="mx" value="'+S.mx+'" inputmode="decimal"></div><div class="card"><b>> TIPS</b><div class="tip" style="margin-top:6px">Add a little weight or a rep each week (progressive overload).<br>Sleep well and eat enough protein; your meal diary target is about 169g.<br>Stop sets 1-2 reps before failure. Rest 1-2 minutes between sets.</div></div><button id="bk">[copy backup]</button> <button id="rt">[restore]</button> <button id="rs" class="tip">[reset all]</button>'}
function render(){var y=window.scrollY;document.getElementById("app").innerHTML=tab===1?lift():tab===2?cardio():tab===3?logv():setv();
 for(var i=1;i<5;i++)document.getElementById("t"+i).className=tab===i?"on":"";window.scrollTo(0,y);bind()}
function bind(){var q=function(s){return document.querySelectorAll(s)},P=function(v){var a=v.split(",");return[a[0],+a[1]]};
 var dy=document.getElementById("dy");if(dy)dy.onchange=function(){S.cur=+dy.value;sess(key()).day=S.cur;save();render()};
 q("[data-r]").forEach(function(e){e.onclick=function(){startTimer(+e.dataset.r)}});
 q("[data-w]").forEach(function(e){e.onchange=function(){var a=P(e.dataset.w);sess(key()).sets[a[0]][a[1]].w=e.value;save()}});
 q("[data-p]").forEach(function(e){e.onchange=function(){var a=P(e.dataset.p);sess(key()).sets[a[0]][a[1]].r=e.value;save()}});
 q("[data-k]").forEach(function(e){e.onchange=function(){var a=P(e.dataset.k);sess(key()).sets[a[0]][a[1]].d=e.checked?1:0;save();render();if(e.checked)startTimer(90)}});
 var ca=document.getElementById("ca");if(ca)ca.onclick=function(){var m=+document.getElementById("cm").value;if(m>0){(S.c[key()]=S.c[key()]||[]).push({t:document.getElementById("ct").value,m:m});save();render()}};
 var cq=document.getElementById("cq");if(cq)cq.onclick=function(){(S.c[key()]=S.c[key()]||[]).push({t:"Walk",m:30});save();render()};
 q("[data-cx]").forEach(function(e){e.onclick=function(){S.c[key()].splice(+e.dataset.cx,1);save();render()}});
 var bb=document.getElementById("bb");if(bb)bb.onchange=function(){S.bar=bb.checked?1:0;save()};
 var mx=document.getElementById("mx");if(mx)mx.onchange=function(){S.mx=+mx.value||20;save()};
 var bk=document.getElementById("bk");if(bk)bk.onclick=function(){var t=JSON.stringify(S);try{navigator.clipboard.writeText(t).then(function(){alert("Backup copied. Paste it into a notes app.")},function(){prompt("Copy this backup:",t)})}catch(x){prompt("Copy this backup:",t)}};
 var rt=document.getElementById("rt");if(rt)rt.onclick=function(){var t=prompt("Paste your backup:");if(!t)return;try{var o=JSON.parse(t);if(o.d&&o.c){S=o;save();render();alert("Restored.")}else alert("Not a valid backup.")}catch(x){alert("Not a valid backup.")}};
 var rs=document.getElementById("rs");if(rs)rs.onclick=function(){if(confirm("Delete all workouts and start again?")){S={d:{},c:{},bar:0,mx:20,cur:0};save();render()}}}
[1,2,3,4].forEach(function(k){document.getElementById("t"+k).onclick=function(){tab=k;window.scrollTo(0,0);render()}});
document.getElementById("tx").onclick=function(){TM=null;tick()};
(function(){var ks=Object.keys(S.d).sort(),l=ks.length?S.d[ks[ks.length-1]]:null;if(l&&ks[ks.length-1]<key()&&Object.keys(l.sets).some(function(q){return l.sets[q].some(function(x){return x.d})}))S.cur=(l.day+1)%5})();
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
